<title>Folder Colours</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: calm dark stage so the colours read true. Folder row on top. Left: the looks grid, then one row per part. Right: the live window, pinned while you scroll. Deliberately dark only. */
  :root {
    --bg: #111215; --panel: #18191d; --raised: #202226; --line: #2a2c31; --fg: #ededf0; --muted: #8b9099; --ring: #ffffff; --good: #3ecf8e; --bad: #ff6b6b;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; }
  button, select { font-family: var(--sans); }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .app { max-width: 1200px; margin: 0 auto; display: grid; gap: 22px; }

  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .sub { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
  .status { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; min-height: 20px; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.ok i { background: var(--good); } .status.err { color: var(--bad); } .status.err i { background: var(--bad); }

  .folders { display: flex; gap: 8px; flex-wrap: wrap; }
  .fold { display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px 9px 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); font-size: 15px; font-weight: 600; cursor: pointer; }
  .fold[aria-selected="true"] { border-color: var(--ring); box-shadow: inset 0 0 0 1px var(--ring); }
  .fsw { width: 26px; height: 19px; border-radius: 4px; overflow: hidden; display: grid; grid-template-rows: 5px 1fr; border: 1px solid #ffffff26; flex: none; }
  .fsw.none { border-style: dashed; background: transparent; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 470px; gap: 32px; align-items: start; }
  .grid > * { min-width: 0; }
  h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 16px 14px; }
  .look { background: none; border: 0; padding: 0; color: var(--fg); cursor: pointer; display: grid; gap: 7px; text-align: left; font-size: 13px; font-weight: 500; }
  .mw { aspect-ratio: 16 / 10; border-radius: 9px; overflow: hidden; display: grid; grid-template-rows: 13% 1fr 9%; border: 1px solid #ffffff1c; transition: transform .12s ease; }
  .look:hover .mw { transform: translateY(-2px); }
  .look[aria-pressed="true"] .mw { outline: 2px solid var(--ring); outline-offset: 3px; }
  .mw .mid { display: grid; grid-template-columns: 9% 27% 1fr; }
  .mw .ed { padding: 11% 10% 0; display: grid; gap: 8%; align-content: start; }
  .mw .ed span { height: 5px; border-radius: 3px; display: block; }
  .mw .ed b { display: block; height: 13px; border-radius: 3px; border: 1.5px solid; margin-top: 6%; }

  .parts { margin-top: 30px; }
  .part { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .part:last-child { border-bottom: 1px solid var(--line); }
  .plabel { font-weight: 600; font-size: 14px; }
  .dots { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
  .dot { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #ffffff30; padding: 0; cursor: pointer; flex: none; }
  .dot[aria-pressed="true"], .any[data-on="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ring); }
  .pill { height: 26px; padding: 0 11px; border-radius: 13px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); font-size: 12px; font-weight: 500; cursor: pointer; }
  .pill[aria-pressed="true"] { border-color: var(--ring); box-shadow: inset 0 0 0 1px var(--ring); }
  .any { width: 26px; height: 26px; border-radius: 50%; position: relative; overflow: hidden; flex: none; cursor: pointer; border: 1px solid #ffffff30;
    background: conic-gradient(#ff5b5b, #ffd35b, #5bff8c, #5bd8ff, #7a5bff, #ff5bd8, #ff5b5b); }
  .any input { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); opacity: 0; cursor: pointer; border: 0; padding: 0; }
  select { height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); font-size: 14px; padding: 0 10px; max-width: 100%; }
  .step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .step button { width: 34px; height: 32px; background: var(--raised); border: 0; color: var(--fg); font-size: 17px; cursor: pointer; }
  .step output { min-width: 50px; text-align: center; font: 13px var(--mono); }

  .right { position: sticky; top: 20px; display: grid; gap: 14px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { height: 36px; padding: 0 15px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
  .btn:disabled { opacity: .35; cursor: default; }
  .note { margin: 0; font-size: 13px; color: var(--muted); }
  .empty { aspect-ratio: 470 / 382; border: 1.5px dashed var(--line); border-radius: 12px; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }

  /* the live VS Code window */
  .win { border-radius: 11px; overflow: hidden; border: 1px solid #00000080; box-shadow: 0 16px 40px #00000066; font-size: 12px; line-height: 1.35; }
  .tbar { height: 30px; display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; padding: 0 10px; }
  .lights { display: flex; gap: 6px; } .lights i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .search { justify-self: center; width: min(260px, 100%); border-radius: 5px; padding: 3px 10px; font-size: 11px; text-align: center; background: #8080801f; border: 1px solid #8080802e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wbody { display: grid; grid-template-columns: 34px 128px minmax(0, 1fr); height: 330px; }
  .act { display: grid; align-content: start; justify-items: center; gap: 14px; padding-top: 12px; position: relative; }
  .act i { width: 15px; height: 15px; border-radius: 3px; display: block; border: 2px solid currentColor; opacity: .5; }
  .act i.on { opacity: 1; background: currentColor; }
  .act .bdg { position: absolute; top: 102px; left: 19px; width: 13px; height: 13px; border-radius: 50%; font-size: 8px; display: grid; place-items: center; font-weight: 700; }
  .side { padding: 10px; display: grid; align-content: start; gap: 7px; font-size: 11px; overflow: hidden; }
  .side .t { font-weight: 600; font-size: 12px; }
  .side .h { font-size: 9.5px; font-weight: 600; letter-spacing: .06em; opacity: .85; margin-top: 4px; }
  .side .kv { display: flex; justify-content: space-between; }
  .side .bar { height: 4px; border-radius: 2px; overflow: hidden; background: #8080803a; } .side .bar span { display: block; height: 100%; }
  .side .sel { border-radius: 4px; padding: 4px 6px; margin: 0 -6px; }
  .ed2 { display: grid; grid-template-rows: 28px minmax(0, 1fr); min-width: 0; }
  .tabs { display: flex; align-items: stretch; }
  .tab { padding: 0 12px; display: flex; align-items: center; font-size: 11px; white-space: nowrap; }
  .area { padding: 14px; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; min-width: 0; overflow: hidden; }
  .msg { border-radius: 7px; padding: 8px 10px; }
  .reply { display: grid; gap: 4px; align-content: start; }
  .reply ul { margin: 2px 0 0; padding-left: 16px; display: grid; gap: 2px; }
  .code { font-family: var(--mono); font-size: 10.5px; border-radius: 5px; padding: 6px 8px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .input { border-radius: 8px; padding: 9px 10px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
  .send { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .sbar { height: 22px; display: flex; align-items: center; font-size: 10.5px; gap: 12px; padding-right: 10px; }
  .sbar .rem { height: 100%; padding: 0 9px; display: flex; align-items: center; }
  .sbar .sp { flex: 1; }

  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } .right { position: static; order: -1; } }
  @media (max-width: 520px) { .wbody { grid-template-columns: 30px 100px minmax(0, 1fr); height: 300px; } .part { grid-template-columns: 1fr; gap: 8px; } }
  @media (prefers-reduced-motion: reduce) { .mw { transition: none; } }
</style>

<main class="app">
  <header class="top">
    <div>
      <h1>Folder colours</h1>
      <p class="sub" id="sub">Click a look. The VS Code window for that folder changes as you click.</p>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"><i></i><span></span></div>
  </header>
  <nav class="folders" id="folders" role="tablist" aria-label="Folder"></nav>
  <div class="grid">
    <section>
      <h2>Pick a look</h2>
      <div class="looks" id="looks"></div>
      <div class="parts" id="parts"></div>
    </section>
    <aside class="right">
      <div id="preview"></div>
      <div class="btns">
        <button type="button" class="btn primary" id="copy" hidden>Copy settings</button>
        <button type="button" class="btn" id="undo">Undo</button>
        <button type="button" class="btn" id="clear">Remove colours</button>
      </div>
      <p class="note" id="note"></p>
    </aside>
  </div>
</main>

          '<div class="kv"><span>Session</span><span>12%</span></div><div class="bar"><span style="width:12%;background:' + o["progressBar.background"] + '"></span></div>' +
          '<div class="kv"><span>Weekly</span><span>74%</span></div><div class="bar"><span style="width:74%;background:' + o["progressBar.background"] + '"></span></div>' +
          '<div class="h">SESSIONS</div><div class="sel" style="background:' + o["list.inactiveSelectionBackground"] + '">Folder colours</div><div>Weekly plan</div><div style="opacity:.7">Client notes</div>' +
        '</div>' +
        '<div class="ed2">' +
          '<div class="tabs" style="background:' + o["editorGroupHeader.tabsBackground"] + ';border-bottom:1px solid ' + o["editorGroup.border"] + '"><div class="tab" style="background:' + o["editor.background"] + ';color:' + o["tab.activeForeground"] + '">Claude Code</div><div class="tab" style="background:' + o["tab.inactiveBackground"] + ';color:' + o["tab.inactiveForeground"] + '">README.md</div></div>' +
          '<div class="area" style="background:' + o["editor.background"] + ';color:' + o["editor.foreground"] + ';' + chat + '">' +
            '<div class="msg" style="background:' + o["input.background"] + ';border:1px solid ' + o["agentsPanel.border"] + '">give this folder its own colours</div>' +
            '<div class="reply"><div>Done. This window now has its own look:</div><ul><li>The border is the top bar, left strip and bottom bar.</li><li>The background is where you read and type.</li><li>Highlights mark the chat box, badges and links.</li></ul>' +
              '<div class="code" style="background:' + o["editorWidget.background"] + '">saved <span style="color:' + o["textLink.foreground"] + '">.vscode/settings.json</span></div></div>' +
            '<div class="input" style="background:' + o["input.background"] + ';border:1.5px solid ' + o["focusBorder"] + ';color:' + o["foreground"] + '"><span style="opacity:.7">Queue another message...</span><span class="send" style="background:' + o["button.background"] + ';color:' + o["button.foreground"] + '">&uarr;</span></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="sbar" style="background:' + o["statusBar.background"] + ';color:' + o["statusBar.foreground"] + '"><span class="rem" style="background:' + o["statusBarItem.remoteBackground"] + ';color:' + o["statusBarItem.remoteForeground"] + '">&gt;&lt;</span><span>0 errors</span><span class="sp"></span><span>Claude Code</span></div>' +
    '</div>';
  }

  function renderFolders() {
    var el = $("folders"); el.hidden = folders.length < 2;
    el.innerHTML = folders.map(function (f, i) {
      var sw = f.picks ? '<span class="fsw" style="background:' + f.picks.bg + '"><span style="background:' + f.picks.border + '"></span></span>' : '<span class="fsw none"></span>';
      return '<button type="button" class="fold" role="tab" aria-selected="' + (i === cur) + '" data-folder="' + i + '">' + sw + esc(f.name) + '</button>';
    }).join("");
  }
  function renderLooks() {
    var now = lookOf(folders[cur].picks);
    $("looks").innerHTML = LOOKS.map(function (L, i) {
      return '<button type="button" class="look" data-look="' + i + '" aria-pressed="' + (now === L.name) + '">' + mini(Object.assign({ font: "default", size: DEFAULT_SIZE }, L)) + '<span>' + L.name + '</span></button>';
    }).join("");
  }
  function renderParts() {
    var h = PARTS.map(function (pt) {
      var k = pt[0], dots = (k === "text" || k === "lines" ? '<button type="button" class="pill" data-part="' + k + '" data-val="auto">Auto</button>' : "") +
        SWATCHES[k].map(function (s) { return '<button type="button" class="dot" data-part="' + k + '" data-val="' + s[1] + '" title="' + s[0] + '" aria-label="' + pt[1] + ': ' + s[0] + '" style="background:' + s[1] + '"></button>'; }).join("") +
        '<label class="any" data-any="' + k + '" title="Any colour"><input type="color" data-color="' + k + '" aria-label="' + pt[1] + ': any colour"></label>';
      return '<div class="part"><div class="plabel">' + pt[1] + '</div><div class="dots">' + dots + '</div></div>';
    }).join("");
    h += '<div class="part"><div class="plabel">Chat font</div><div class="dots"><select id="font" aria-label="Chat font">' +
      fonts.map(function (f) { return '<option value="' + esc(f) + '">' + (f === "default" ? "VS Code default" : esc(f)) + '</option>'; }).join("") +
      '</select><div class="step"><button type="button" data-step="-1" aria-label="Smaller text">&minus;</button><output id="size"></output><button type="button" data-step="1" aria-label="Bigger text">+</button></div></div></div>';
    $("parts").innerHTML = h;
  }
  function syncParts() {
    var p = folders[cur].picks;
    document.querySelectorAll("[data-part]").forEach(function (el) { el.setAttribute("aria-pressed", String(!!p && p[el.getAttribute("data-part")] === el.getAttribute("data-val"))); });
    PARTS.forEach(function (pt) {
      var k = pt[0], v = p ? p[k] : null, known = !!v && (v === "auto" || SWATCHES[k].some(function (s) { return s[1] === v; }));
      document.querySelector('[data-any="' + k + '"]').setAttribute("data-on", String(!!v && !known));
      var input = document.querySelector('[data-color="' + k + '"]'), shown = v && v !== "auto" ? v : (p ? build(p)[{ text: "editor.foreground", lines: "editorGroup.border" }[k] || "editor.background"] : "#888888");
      if (document.activeElement !== input) input.value = shown.slice(0, 7);
    });
    var fs = $("font"), want = p ? p.font : "default";
    if (fonts.indexOf(want) < 0) { fonts.push(want); renderParts(); return syncParts(); }
    fs.value = want; $("size").textContent = (p ? p.size : DEFAULT_SIZE) + "px";
  }
  function renderPreview() {
    var f = folders[cur];
    $("preview").innerHTML = f.picks ? win(f.picks, f.name) : '<div class="empty"><div><strong style="color:var(--fg)">No colours yet</strong><br>' + esc(f.name) + ' is using your normal VS Code theme.<br>Pick a look to start.</div></div>';
    $("undo").disabled = !f.history.length;
    $("clear").disabled = !f.picks || !live;
    $("copy").disabled = !f.picks;
  }
  function refresh() { renderFolders(); renderLooks(); syncParts(); renderPreview(); }
  function status(text, kind) { var el = $("status"); el.className = "status " + (kind || ""); el.querySelector("span").textContent = text; }

  // ---- Changes and saving
  var lastKey = "", lastAt = 0;
  function change(partial, key) {
    var f = folders[cur], now = Date.now();
    if (!(key && key === lastKey && now - lastAt < 900)) { f.history.push(f.picks); if (f.history.length > 60) f.history.shift(); }
    lastKey = key || ""; lastAt = now;
    var base = f.picks || Object.assign({ font: "default", size: DEFAULT_SIZE }, LOOKS[0]);
    f.picks = { border: base.border, bg: base.bg, text: base.text, lines: base.lines || "auto", hl: base.hl, font: base.font, size: base.size };
    Object.keys(partial).forEach(function (k) { f.picks[k] = partial[k]; });
    f.picks.look = lookOf(f.picks);
    refresh(); queueSave(f);
  }
  function queueSave(f) {
    if (!live) { status("Preview only. Nothing is saved from this page.", ""); return; }
    status("Saving...", ""); clearTimeout(f.timer); f.timer = setTimeout(function () { save(f); }, 220);
  }
  function save(f) {
    fetch("api/save", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: f.path, picks: f.picks, colours: f.picks ? build(f.picks) : null }) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || "Could not save"); }); })
      .then(function () { status(f.picks ? "Saved. The " + f.name + " window has updated." : "Colours removed from " + f.name + ".", "ok"); })
      .catch(function (e) { status("Not saved. " + (e.message === "Failed to fetch" ? "The colours tool has stopped, run it again." : e.message), "err"); });
  }

  document.addEventListener("click", function (e) {
    var t;
    if ((t = e.target.closest("[data-folder]"))) { cur = +t.getAttribute("data-folder"); refresh(); return; }
    if ((t = e.target.closest("[data-look]"))) { var L = LOOKS[+t.getAttribute("data-look")]; change({ border: L.border, bg: L.bg, text: L.text, lines: "auto", hl: L.hl }); return; }
    if ((t = e.target.closest("[data-part]"))) { var o = {}; o[t.getAttribute("data-part")] = t.getAttribute("data-val"); change(o); return; }
    if ((t = e.target.closest("[data-step]"))) { var p = folders[cur].picks, s = (p ? p.size : DEFAULT_SIZE) + (+t.getAttribute("data-step")); if (s >= 10 && s <= 22) change({ size: s }); return; }
    if (e.target.id === "undo") { var f = folders[cur]; if (f.history.length) { f.picks = f.history.pop(); lastKey = ""; refresh(); queueSave(f); } return; }
    if (e.target.id === "clear") { var g = folders[cur]; if (g.picks) { g.history.push(g.picks); g.picks = null; refresh(); queueSave(g); } return; }
    if (e.target.id === "copy") {
      var text = JSON.stringify(settingsFor(folders[cur].picks), null, 2), btn = e.target;
      var done = function (ok) { status(ok ? "Copied. Paste it into .vscode/settings.json in your folder." : "Copy was blocked by the browser.", ok ? "ok" : "err"); btn.textContent = ok ? "Copied" : "Copy settings"; setTimeout(function () { btn.textContent = "Copy settings"; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); else done(false);
    }
  });
  document.addEventListener("input", function (e) {
    var k = e.target.getAttribute && e.target.getAttribute("data-color");
    if (k) { var o = {}; o[k] = e.target.value.toLowerCase(); change(o, "color-" + k); }
  });
  document.addEventListener("change", function (e) { if (e.target.id === "font") change({ font: e.target.value }); });

  // ---- Start: talk to colours.py if it is running, otherwise preview only.
  function start(list) {
    folders = list.map(function (f) { if (f.picks && !f.picks.lines) f.picks.lines = "auto"; return { name: f.name, path: f.path, picks: f.picks, history: [], timer: null }; });
    FONT_CANDIDATES.forEach(function (f) { if (hasFont(f)) fonts.push(f); });
    $("copy").hidden = live;
    if (!live) { $("sub").textContent = "Click a look to preview it. To save straight into VS Code, run colours.py. Or copy the settings into your folder's .vscode/settings.json."; $("note").textContent = "Preview only. Nothing on this page changes your computer."; }
    else { $("note").textContent = "Saves into each folder's .vscode/settings.json. Your other settings are kept."; status("Ready. Pick a look.", ""); }
    renderParts(); refresh();
  }
  fetch("api/folders", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function (d) { live = true; start(d.folders); })
    .catch(function () { live = false; start([{ name: "Your folder", path: null, picks: null }]); });
})();
</script>
